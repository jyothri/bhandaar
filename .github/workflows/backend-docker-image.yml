name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "be/**"
      - ".github/workflows/backend-docker-image.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "be/**"
      - ".github/workflows/backend-docker-image.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BE_TEST_DB: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: be/go.mod
          cache-dependency-path: be/go.sum
      - name: Test (with race detector, against Postgres)
        run: go test -race ./...
        working-directory: be

  backend:
    # Don't build or push an image whose tests fail.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - uses: mr-smithers-excellent/docker-build-push@v7
        name: Build Docker image (push to Docker Hub only on main)
        with:
          image: ${{ env.REPO }}
          addLatest: true
          # PRs build only; pushing :latest from a PR would ship unmerged code
          # to production, which runs :latest.
          pushImage: ${{ github.event_name == 'push' }}
          registry: docker.io
          dockerfile: ./be/build/Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
