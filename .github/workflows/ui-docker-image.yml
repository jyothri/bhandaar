name: Docker UI Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "ui/**"
      - ".github/workflows/ui-docker-image.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ui/**"
      - ".github/workflows/ui-docker-image.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  ui:
    # Don't build or push an image that fails lint or typecheck.
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}-ui" >>${GITHUB_ENV}

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build Docker image (push to Docker Hub only on main)
        with:
          image: ${{ env.REPO }}
          addLatest: true
          # PRs build only; pushing :latest from a PR would ship unmerged code
          # to production, which runs :latest.
          pushImage: ${{ github.event_name == 'push' }}
          registry: docker.io
          dockerfile: ./ui/Dockerfile
          # Needed for ui/Dockerfile.dockerignore (the build context is the repo root).
          enableBuildKit: true
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
