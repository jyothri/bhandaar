  <rect x="8" y="8.5" width="10" height="3.5" rx="1.75" fill="#bfdbfe"/>
  <rect x="8" y="14.25" width="13" height="3.5" rx="1.75" fill="#dbeafe"/>
  <rect x="8" y="20" width="16" height="3.5" rx="1.75" fill="#ffffff"/>
</svg>
